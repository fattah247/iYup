name: CI

on:
  push:
    branches:
      - main
      - dev
      - "features/**"
    paths:
      - "services/ping-agent/**"
      - "services/api-gateway/**"
      - "charts/**"
      - "config/**"
      - "monitoring/**"
      - "docker-compose*.yml"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "services/ping-agent/**"
      - "services/api-gateway/**"
      - "charts/**"
      - "config/**"
      - "monitoring/**"
      - "docker-compose*.yml"
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Go fmt
        run: |
          cd services/ping-agent
          test -z "$(gofmt -l .)"
      - name: Go vet
        run: |
          cd services/ping-agent
          go vet ./...
      - name: Go tests
        run: |
          cd services/ping-agent
          go test -race ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api-gateway/requirements-dev.txt
      - name: Python lint
        run: |
          python -m py_compile services/api-gateway/*.py scripts/check_dashboard_queries.py scripts/reliability/*.py
      - name: Python tests
        run: |
          python -m unittest discover -s services/api-gateway -p "test*.py"

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build ping-agent image
        run: docker build -t ping-agent:ci services/ping-agent
      - name: Build api-gateway image
        run: docker build -t api-gateway:ci services/api-gateway

  monitoring-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/config:/etc/prometheus/rules:ro" -v "$PWD/config/prometheus.yml:/p.yml:ro" \
            --entrypoint promtool prom/prometheus:v2.54.1 check config /p.yml
      - name: Alert rule unit tests
        run: |
          docker run --rm -v "$PWD/config:/c:ro" --entrypoint promtool prom/prometheus:v2.54.1 \
            test rules /c/alert.rules.test.yml
      - name: Alertmanager config
        run: |
          docker run --rm -v "$PWD/config:/c:ro" --entrypoint amtool prom/alertmanager:v0.27.0 \
            check-config /c/alertmanager.yml
      - name: Grafana dashboard is valid JSON
        run: python3 -m json.tool monitoring/grafana-dashboard.json > /dev/null

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker Compose config
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.demo.yml config -q

  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint ./charts/iyup
      - name: Helm template
        run: helm template iyup ./charts/iyup
