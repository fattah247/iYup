global:
  resolve_timeout: 1m

route:
  receiver: default
  group_by: [alertname, target]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

# A hard-down target already has TargetDown; don't also page for "unreliable".
inhibit_rules:
  - source_matchers: [alertname="TargetDown"]
    target_matchers: [alertname="TargetUnreliable"]
    equal: [target]

receivers:
  - name: default
    webhook_configs: []
    # To add Slack notifications, uncomment:
    # slack_configs:
    #   - api_url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
    #     channel: "#alerts"
    #     send_resolved: true

    # To add email notifications, add to global section above:
    # smtp_smarthost: smtp.gmail.com:587
    # smtp_from: alerts@example.com
    # smtp_auth_username: you@gmail.com
    # smtp_auth_password: your-app-password
    # smtp_require_tls: true
    #
    # Then uncomment:
    # email_configs:
    #   - to: "you@example.com"
    #     send_resolved: true
