global:
  scrape_interval: 15s
  # Rules are evaluated every minute by default, which adds up to a minute of
  # delay on top of each alert's `for:` and made alerting depend on timing luck.
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # One agent per region; the list lives in agents.yml so more can be added
  # without touching this file (the demo swaps in two).
  - job_name: ping-agent
    file_sd_configs:
      - files: [/etc/prometheus/agents.yml]

  - job_name: api-gateway
    static_configs:
      - targets:
          - api-gateway:8080
