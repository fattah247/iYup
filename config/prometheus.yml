global:
  scrape_interval: 15s
  # Rules are evaluated every minute by default, which adds up to a minute of
  # delay on top of each alert's `for:` and made alerting depend on timing luck.
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: ping-agent
    static_configs:
      - targets:
          - ping-agent:8080

  - job_name: api-gateway
    static_configs:
      - targets:
          - api-gateway:8080
