# What the ping-agent checks. Edit, then apply with: docker compose up -d ping-agent
# Setting PING_TARGET_URLS (in .env) overrides this file with a plain URL list.
# Full reference: docs/CONFIGURATION.md

defaults:
  interval: 30s
  timeout: 10s
  retries: 2
  slo: 99.9 # availability objective in percent, judged over 30 days

targets:
  - name: Google
    url: https://google.com
  - name: GitHub
    url: https://github.com

