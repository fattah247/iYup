nameOverride: ""
fullnameOverride: ""

# Plain URL list, used when `checks` is empty. The api-gateway discovers
# targets from the agent, so it needs no list of its own.
pingTargets:
  - https://google.com
  - https://github.com

# Checks as code: the same format as config/targets/targets.yml (see
# docs/CONFIGURATION.md). When set, it replaces pingTargets.
checks: {}
# checks:
#   defaults: {interval: 30s, slo: 99.9}
#   targets:
#     - {name: Website, url: https://example.com, degraded_after: 1s}
#     - {name: Postgres, type: tcp, address: "db.internal:5432"}
#   domains: [example.com]

image:
  pingAgent: ping-agent:latest
  apiGateway: api-gateway:latest
  prometheus: prom/prometheus:v2.54.1
  grafana: grafana/grafana:13.0.1
  alertmanager: prom/alertmanager:v0.27.0
  alertLogger: mendhak/http-https-echo:36

pingAgent:
  intervalSeconds: 30
  timeoutSeconds: 10
  concurrency: 5
  retryCount: 2
  httpMethod: GET
  rangeRequest: true
  region: "" # set per cluster when several agents report to one Prometheus

service:
  apiGatewayPort: 80
  apiGatewayTargetPort: 8080
  pingAgentPort: 8080
  prometheusPort: 9090
  grafanaPort: 3000
  alertmanagerPort: 9093
  alertLoggerPort: 8080

prometheus:
  retention: 35d # long enough to judge a 30-day error budget
  pvcSize: 5Gi

grafana:
  pvcSize: 5Gi

alertmanager:
  pvcSize: 1Gi

alert:
  # Every alert goes to the in-cluster alert-logger. Each receiver below is
  # added only when configured; put real values in a git-ignored values file.
  smtp:
    smarthost: "" # e.g. smtp.gmail.com:587
    from: ""
    user: ""
    password: ""
    to: ""
  slackWebhook: ""
  discordWebhook: ""
  telegram:
    botToken: ""
    chatId: 0
  webhookUrl: "" # any receiver that accepts Alertmanager's webhook JSON
  # Dead man's switch for the always-firing Watchdog alert, e.g. a
  # healthchecks.io ping URL that alerts you when the heartbeat stops.
  heartbeatUrl: ""

ingress:
  enabled: false
  host: iyup.local
