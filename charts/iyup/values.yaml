nameOverride: ""
fullnameOverride: ""

pingTargets: # rendered into PING_TARGET_URLS for the ping-agent; the api-gateway discovers them from it
  - https://google.com
  - https://github.com

image:
  pingAgent: ping-agent:latest
  apiGateway: api-gateway:latest
  prometheus: prom/prometheus:v2.54.1
  grafana: grafana/grafana:13.0.1
  alertmanager: prom/alertmanager:v0.27.0
  alertLogger: mendhak/http-https-echo:36

pingAgent:
  intervalSeconds: 30
  timeoutSeconds: 10
  concurrency: 5
  retryCount: 2
  httpMethod: GET
  rangeRequest: true

service:
  apiGatewayPort: 80
  apiGatewayTargetPort: 8080
  pingAgentPort: 8080
  prometheusPort: 9090
  grafanaPort: 3000
  alertmanagerPort: 9093
  alertLoggerPort: 8080

prometheus:
  retention: 14d
  pvcSize: 5Gi

grafana:
  pvcSize: 5Gi

alert:
  # Every alert goes to the in-cluster alert-logger. Email and Slack receivers
  # are added only when configured; put real values in a git-ignored values file.
  smtp:
    smarthost: "" # e.g. smtp.gmail.com:587
    from: ""
    user: ""
    password: ""
    to: ""
  slackWebhook: ""

ingress:
  enabled: false
  host: uptimpulse.local
