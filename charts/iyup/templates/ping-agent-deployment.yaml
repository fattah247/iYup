apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iyup.fullname" . }}-ping-agent
  labels:
    {{- include "iyup.labels" . | nindent 4 }}
    app.kubernetes.io/component: ping-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "iyup.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ping-agent
  template:
    metadata:
      labels:
        {{- include "iyup.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ping-agent
    spec:
      containers:
      - name: ping-agent
        image: {{ .Values.image.pingAgent | quote }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
          - name: PING_TARGET_URLS
            value: '{{ join "," .Values.pingTargets }}'
          - name: PING_INTERVAL_SECONDS
            value: {{ .Values.pingAgent.intervalSeconds | quote }}
          - name: PING_TIMEOUT_SECONDS
            value: {{ .Values.pingAgent.timeoutSeconds | quote }}
          - name: PING_CONCURRENCY
            value: {{ .Values.pingAgent.concurrency | quote }}
          - name: PING_RETRY_COUNT
            value: {{ .Values.pingAgent.retryCount | quote }}
          - name: PING_HTTP_METHOD
            value: {{ .Values.pingAgent.httpMethod | quote }}
          - name: PING_RANGE_REQUEST
            value: {{ .Values.pingAgent.rangeRequest | quote }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
