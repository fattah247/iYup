{{- $smtp := .Values.alert.smtp -}}
{{- $a := .Values.alert -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "iyup.fullname" . }}-alertmanager-config
  labels:
    {{- include "iyup.labels" . | nindent 4 }}
type: Opaque
# Alertmanager does not expand environment variables in its config, so the
# file is rendered here with real values (it holds credentials, hence a Secret).
# Routing matches config/alertmanager.yml: critical alerts page, the rest
# notify, and the always-firing Watchdog goes to the heartbeat URL.
stringData:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      {{- if $smtp.smarthost }}
      smtp_smarthost: {{ $smtp.smarthost | quote }}
      smtp_from: {{ $smtp.from | quote }}
      smtp_auth_username: {{ $smtp.user | quote }}
      smtp_auth_password: {{ $smtp.password | quote }}
      smtp_require_tls: true
      {{- end }}

    route:
      receiver: notify
      group_by: [alertname, target]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers: [alertname="Watchdog"]
          receiver: heartbeat
          group_by: [alertname]
          group_wait: 0s
          group_interval: 1m
          # Repeats go out on group_interval ticks once repeat_interval has passed
          # since the last send; 1m would just miss every other tick (2m cadence).
          repeat_interval: 50s
        - matchers: [severity="critical"]
          receiver: page
          repeat_interval: 1h

    inhibit_rules:
      - source_matchers: [alertname="TargetDown"]
        target_matchers: [alertname=~"TargetSlow|TargetRegionalFailure|ErrorBudgetBurnFast|ErrorBudgetBurnSlow"]
        equal: [target]
      - source_matchers: [alertname="ErrorBudgetBurnFast"]
        target_matchers: [alertname="ErrorBudgetBurnSlow"]
        equal: [target]
      - source_matchers: [alertname="AllPingAgentsDown"]
        target_matchers: [alertname=~"PingAgentDown|TargetChecksStale"]

    receivers:
      {{- range $name := list "page" "notify" }}
      - name: {{ $name }}
        webhook_configs:
          - url: 'http://{{ include "iyup.fullname" $ }}-alert-logger:{{ $.Values.service.alertLoggerPort }}/'
            send_resolved: true
          {{- if $a.webhookUrl }}
          - url: {{ $a.webhookUrl | quote }}
            send_resolved: true
          {{- end }}
        {{- if $smtp.smarthost }}
        email_configs:
          - to: {{ $smtp.to | quote }}
            send_resolved: true
        {{- end }}
        {{- if $a.slackWebhook }}
        slack_configs:
          - api_url: {{ $a.slackWebhook | quote }}
            send_resolved: true
        {{- end }}
        {{- if $a.discordWebhook }}
        discord_configs:
          - webhook_url: {{ $a.discordWebhook | quote }}
            send_resolved: true
        {{- end }}
        {{- if $a.telegram.botToken }}
        telegram_configs:
          - bot_token: {{ $a.telegram.botToken | quote }}
            chat_id: {{ int64 $a.telegram.chatId }}
            send_resolved: true
        {{- end }}
      {{- end }}
      - name: heartbeat
        {{- if $a.heartbeatUrl }}
        webhook_configs:
          - url: {{ $a.heartbeatUrl | quote }}
            send_resolved: false
        {{- end }}
