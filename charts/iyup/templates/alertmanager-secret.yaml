{{- $smtp := .Values.alert.smtp -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "iyup.fullname" . }}-alertmanager-config
  labels:
    {{- include "iyup.labels" . | nindent 4 }}
type: Opaque
# Alertmanager does not expand environment variables in its config, so the
# file is rendered here with real values (it holds SMTP credentials, hence a Secret).
stringData:
  alertmanager.yml: |
    global:
      resolve_timeout: 1m
      {{- if $smtp.smarthost }}
      smtp_smarthost: {{ $smtp.smarthost | quote }}
      smtp_from: {{ $smtp.from | quote }}
      smtp_auth_username: {{ $smtp.user | quote }}
      smtp_auth_password: {{ $smtp.password | quote }}
      smtp_require_tls: true
      {{- end }}

    route:
      receiver: alert-log
      group_by: [alertname, target]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      # Children have no matchers and `continue: true`, so every alert reaches
      # every configured receiver instead of stopping at the first.
      routes:
        - receiver: alert-log
          continue: true
        {{- if $smtp.smarthost }}
        - receiver: email
          continue: true
        {{- end }}
        {{- if .Values.alert.slackWebhook }}
        - receiver: slack
          continue: true
        {{- end }}

    inhibit_rules:
      - source_matchers: [alertname="TargetDown"]
        target_matchers: [alertname="TargetUnreliable"]
        equal: [target]

    receivers:
      - name: alert-log
        webhook_configs:
          - url: 'http://{{ include "iyup.fullname" . }}-alert-logger:{{ .Values.service.alertLoggerPort }}/'
            send_resolved: true
      {{- if $smtp.smarthost }}
      - name: email
        email_configs:
          - to: {{ $smtp.to | quote }}
            send_resolved: true
      {{- end }}
      {{- if .Values.alert.slackWebhook }}
      - name: slack
        slack_configs:
          - api_url: {{ .Values.alert.slackWebhook | quote }}
            send_resolved: true
      {{- end }}
