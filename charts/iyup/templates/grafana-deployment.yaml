apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iyup.fullname" . }}-grafana
  labels:
    {{- include "iyup.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      {{- include "iyup.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      annotations:
        # Grafana did not reload provisioned dashboards without a restart.
        checksum/provisioning: {{ include (print $.Template.BasePath "/grafana-provisioning-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "iyup.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      containers:
        - name: grafana
          image: {{ .Values.image.grafana | quote }}
          ports:
            - containerPort: 3000
          env:
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /etc/grafana/dashboards/iyup.json
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yml
              subPath: datasources.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: dashboards
              mountPath: /etc/grafana/dashboards
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "iyup.fullname" . }}-grafana-data
        - name: provisioning
          configMap:
            name: {{ include "iyup.fullname" . }}-grafana-provisioning
        - name: dashboards
          configMap:
            name: {{ include "iyup.fullname" . }}-grafana-dashboards
