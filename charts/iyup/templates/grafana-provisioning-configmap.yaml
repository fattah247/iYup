apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "iyup.fullname" . }}-grafana-provisioning
  labels:
    {{- include "iyup.labels" . | nindent 4 }}
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: 'http://{{ include "iyup.fullname" . }}-prometheus:{{ .Values.service.prometheusPort }}'
        isDefault: true
        editable: false
  # Same provider file Docker Compose uses (files/ links to config/).
  dashboards.yml: |
{{ .Files.Get "files/grafana-dashboards.yml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "iyup.fullname" . }}-grafana-dashboards
  labels:
    {{- include "iyup.labels" . | nindent 4 }}
data:
  iyup.json: |
{{ .Files.Get "files/grafana-dashboard.json" | indent 4 }}
